<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161e2e"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Title Bar -->
  <rect x="25" y="25" width="750" height="60" rx="8" fill="#111827" stroke="#2d3748" stroke-width="1"/>
  <text x="50" y="60" fill="#60a5fa" font-size="18" font-weight="bold">🛡️ PayloadGuard Pro — Automated Fuzz-Test Vector Matrix</text>
  <rect x="660" y="42" width="95" height="26" rx="13" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
  <text x="677" y="59" fill="#34d399" font-size="11" font-weight="bold">CLIENT-SIDE</text>

  <!-- Summary Card -->
  <rect x="25" y="100" width="750" height="90" rx="10" fill="url(#cardGrad)" stroke="#2d3748" stroke-width="1"/>
  <text x="45" y="130" fill="#f3f4f6" font-size="15" font-weight="bold">Synthesized 12 Adversarial &amp; Boundary Attack Vectors</text>
  <text x="45" y="152" fill="#9ca3af" font-size="12">Target Schema: OrderCheckoutPayload • Exports: Jest/Vitest (TypeScript) &amp; PyTest (Python)</text>
  <rect x="45" y="162" width="160" height="18" rx="4" fill="#f59e0b" fill-opacity="0.2"/>
  <text x="52" y="175" fill="#fbbf24" font-size="10" font-weight="bold">Boundary &amp; Security Hardening</text>

  <!-- Vector 1: Missing Required -->
  <rect x="25" y="205" width="750" height="65" rx="6" fill="#161e2e" stroke="#2d3748" stroke-width="1"/>
  <rect x="25" y="205" width="6" height="65" rx="2" fill="#ef4444"/>
  <text x="45" y="230" fill="#f3f4f6" font-size="13" font-weight="bold">FUZZ_REQ_OMIT_ORDER_ID: Omit required property 'order_id'</text>
  <rect x="650" y="217" width="110" height="20" rx="4" fill="#ef4444" fill-opacity="0.2"/>
  <text x="662" y="231" fill="#f87171" font-size="10" font-weight="bold">REJECT_HTTP_422</text>
  <text x="45" y="252" fill="#9ca3af" font-size="11">Verifies API gateway rejects payload before executing database write queries.</text>

  <!-- Vector 2: Type Coercion -->
  <rect x="25" y="280" width="750" height="65" rx="6" fill="#161e2e" stroke="#2d3748" stroke-width="1"/>
  <rect x="25" y="280" width="6" height="65" rx="2" fill="#f59e0b"/>
  <text x="45" y="305" fill="#f3f4f6" font-size="13" font-weight="bold">FUZZ_TYPE_COERCE_NUM_TOTAL_AMOUNT: Inject string into numeric float</text>
  <rect x="650" y="292" width="110" height="20" rx="4" fill="#ef4444" fill-opacity="0.2"/>
  <text x="662" y="306" fill="#f87171" font-size="10" font-weight="bold">REJECT_HTTP_422</text>
  <text x="45" y="327" fill="#9ca3af" font-size="11">Injected "not_a_number_string" into total_amount to prevent arithmetic NaN corruption.</text>

  <!-- Vector 3: Security Injection -->
  <rect x="25" y="355" width="750" height="65" rx="6" fill="#161e2e" stroke="#2d3748" stroke-width="1"/>
  <rect x="25" y="355" width="6" height="65" rx="2" fill="#8b5cf6"/>
  <text x="45" y="380" fill="#f3f4f6" font-size="13" font-weight="bold">FUZZ_SEC_SQLI_CUSTOMER_EMAIL: Injected SQL pattern (' OR 1=1 --)</text>
  <rect x="650" y="367" width="110" height="20" rx="4" fill="#8b5cf6" fill-opacity="0.2"/>
  <text x="660" y="381" fill="#c084fc" font-size="10" font-weight="bold">SANITIZED/REJECT</text>
  <text x="45" y="402" fill="#9ca3af" font-size="11">Verifies format="email" constraint rejects non-RFC compliant SQL syntax payloads.</text>
</svg>
